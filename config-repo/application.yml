# Configuración común a TODOS los microservicios
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  jpa:
    hibernate:
      ddl-auto: update        # Hibernate crea/actualiza las tablas desde las @Entity
    show-sql: true
    open-in-view: false
    properties:
      # Carga las colecciones LAZY de a lotes (evita una consulta por cada fila en los listados)
      hibernate.default_batch_fetch_size: 50
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    web:
      pageable:
        serialization-mode: via-dto   # Page<T> se devuelve con un JSON estable (content + page)
        max-page-size: 100

# JWT firmado con HS256. auth-service lo emite; el api-gateway y los servicios lo validan.
# La clave de abajo es solo para desarrollo: en producción definir la variable JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:a0bfJXOAl4cblbzfULdXzo6qDwDDpulPfIpEE5x9V7QGRsQtY18uOSiB5X/ZNk3h6/VwHEmycAasT+vBNzIyLg==}
  access-token-minutos: 15

# Exchange de RabbitMQ (tipo topic) donde todos los servicios publican sus eventos
eventos:
  exchange: concesionaria.eventos

management:
  endpoints:
    web:
      exposure:
        include: health,info
