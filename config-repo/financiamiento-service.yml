server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/db_financiamiento
    username: financiamiento_user
    password: cambiar_financiamiento

financiamiento:
  # Job diario que marca cuotas vencidas, calcula la mora y manda recordatorios (RF-33, RF-37)
  cron-vencimientos: "0 0 1 * * *"
  # Con cuántos días de anticipación se recuerda una cuota (RF-37)
  dias-aviso-vencimiento: 3

# Documentación de la API (Swagger UI)
openapi:
  titulo: "Financiamiento y pagos"
  descripcion: "Planes, simulador de cuotas, cronogramas, pagos, estado de cuenta y mora."
