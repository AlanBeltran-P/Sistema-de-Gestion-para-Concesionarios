server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_auth
    username: auth_user
    password: cambiar_auth

jwt:
  refresh-token-dias: 7

auth:
  recuperacion-password:
    expiracion-minutos: 30
  # Se crea al arrancar solo si no existe ningún ADMIN. Cambiar la contraseña después del primer login.
  admin-inicial:
    email: ${ADMIN_EMAIL:admin@concesionaria.com}
    password: ${ADMIN_PASSWORD:Admin12345}
    nombre: Administrador
    apellido: General
