# Infraestructura local: MySQL (una base por microservicio), RabbitMQ y Mailpit (emails de prueba).
# Levantar:  docker compose up -d
# Bajar:     docker compose down      (agregar -v para borrar también los datos)

services:
  mysql:
    image: mysql:8.4
    container_name: concesionaria-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Los scripts de esta carpeta corren solo la primera vez (con el volumen vacío)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: concesionaria-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP (lo usan los microservicios)
      - "15672:15672"   # Panel web: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Servidor SMTP de desarrollo: notificacion-service le manda los emails y Mailpit los guarda
  # sin enviarlos de verdad. Para verlos: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: concesionaria-mailpit
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # Panel web
    restart: unless-stopped

volumes:
  mysql-data:
  rabbitmq-data:
